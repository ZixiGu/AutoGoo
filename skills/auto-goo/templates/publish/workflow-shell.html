<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
:root {
  color-scheme: light;
  --bg: #f6f8fa;
  --bg-2: #ffffff;
  --panel: #ffffff;
  --panel-strong: #f6f8fa;
  --line: #d0d7de;
  --line-strong: #afb8c1;
  --text: #24292f;
  --muted: #57606a;
  --faint: #6e7781;
  --blue: #0969da;
  --cyan: #1f883d;
  --green: #2da44e;
  --amber: #9a6700;
  --red: #cf222e;
  --violet: #7656a6;
  --blue-soft: #edf5ff;
  --green-soft: #edf8f2;
  --cyan-soft: #eaf8f8;
  --amber-soft: #fff7e6;
  --violet-soft: #f5f0fb;
  --shadow: 0 10px 28px rgba(27, 31, 36, 0.08);
  --radius: 8px;
  --sidebar: 248px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at 18% 0%, rgba(9, 105, 218, 0.10), transparent 34%),
    radial-gradient(circle at 80% 8%, rgba(45, 164, 78, 0.10), transparent 28%),
    linear-gradient(135deg, var(--bg), var(--bg-2) 62%, #eef6ff);
  color: var(--text);
  letter-spacing: 0;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(27,31,36,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(27,31,36,.035) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,.66), transparent 72%);
}
button, input, select { font: inherit; }
a { color: inherit; }
code {
  padding: 1px 5px;
  border: 1px solid #d0d7de;
  border-radius: 5px;
  color: #0969da;
  background: #f6f8fa;
}
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar) minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 22px 16px;
  border-right: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(22px);
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 8px 18px;
  border-bottom: 1px solid var(--line);
}
.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: linear-gradient(145deg, #0969da, #2da44e);
  box-shadow: 0 10px 30px rgba(9,105,218,.16);
  position: relative;
}
.brand-mark::after {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1.5px solid rgba(255,255,255,.72);
  border-radius: 4px;
}
.brand h1 {
  margin: 0;
  font-size: 15px;
  line-height: 1.1;
  font-weight: 720;
}
.brand span {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
}
.nav-section {
  display: grid;
  gap: 4px;
  margin-top: 20px;
}
.nav-label {
  padding: 0 10px 8px;
  color: var(--faint);
  font-size: 11px;
  font-weight: 760;
  text-transform: uppercase;
  letter-spacing: .08em;
}
.nav-item {
  width: 100%;
  min-height: 42px;
  border: 1px solid transparent;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
  text-decoration: none;
  position: relative;
  font-size: 14px;
  font-weight: 650;
}
.nav-item:hover, .nav-item.active, .nav-item:focus-visible {
  color: var(--text);
  border-color: var(--line);
  background: var(--control-hover);
  text-decoration: none;
}
.nav-item:focus-visible {
  outline: 2px solid rgba(102, 166, 255, .72);
  outline-offset: 2px;
}
.nav-item.active {
  box-shadow: inset 0 0 0 1px rgba(9,105,218,.08);
}
.nav-item.active::before {
  content: "";
  position: absolute;
  left: -3px;
  width: 3px;
  height: 24px;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--blue), var(--cyan));
}
.nav-icon {
  width: 22px;
  height: 22px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  display: inline-grid;
  place-items: center;
  color: var(--muted);
  background: var(--control-bg);
  flex: 0 0 auto;
}
.nav-icon::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 3px;
  background: currentColor;
  opacity: .62;
}
.nav-item:hover .nav-icon, .nav-item.active .nav-icon {
  color: #ffffff;
  border-color: transparent;
  background: linear-gradient(145deg, var(--blue), var(--cyan));
}
.nav-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.nav-badge {
  margin-left: auto;
  min-width: 22px;
  height: 20px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 7px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 760;
  line-height: 1;
}
.nav-badge.live {
  color: #1a7f37;
  border-color: #aceebb;
  background: #dafbe1;
  animation: pulse 1.8s ease-in-out infinite;
}
.sidebar-card {
  margin: 22px 6px 0;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(180deg, #ffffff, #f6f8fa);
}
.sidebar-card strong { display: block; font-size: 13px; }
.sidebar-card p {
  margin: 6px 0 12px;
  color: var(--muted);
  font-size: 12px;
}
.mini-progress {
  height: 6px;
  border-radius: 999px;
  overflow: hidden;
  background: #eaeef2;
}
.mini-progress span {
  display: block;
  height: 100%;
  width: 68%;
  background: linear-gradient(90deg, var(--blue), var(--cyan));
}
.main {
  min-width: 0;
  padding: 18px 22px 28px;
}
.topbar {
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 14px;
  margin-bottom: 12px;
}
.compact-topbar {
  min-height: 42px;
}
.search {
  flex: 1;
  min-width: 260px;
  height: 42px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #ffffff;
  backdrop-filter: blur(20px);
}
.search input {
  width: 100%;
  border: 0;
  outline: 0;
  color: var(--text);
  background: transparent;
}
.search input::placeholder { color: var(--faint); }
.top-action {
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0 12px;
  color: var(--text);
  background: #ffffff;
  backdrop-filter: blur(18px);
}
.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #07111f;
  font-weight: 800;
  background: linear-gradient(135deg, #dbeafe, #dcfce7);
}
.page-title {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 16px;
  margin-bottom: 16px;
}
.page-title h2 {
  margin: 0;
  font-size: 26px;
  line-height: 1.15;
  font-weight: 760;
}
.page-title p {
  max-width: 880px;
  margin: 6px 0 0;
  color: var(--muted);
}
.live-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 32px;
  padding: 6px 11px;
  border: 1px solid rgba(74,222,128,.26);
  border-radius: 999px;
  color: #1f883d;
  background: #dafbe1;
  white-space: nowrap;
}
.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 5px rgba(45,164,78,.14);
  animation: pulse 1.8s ease-in-out infinite;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.metric-card, .panel, .data-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow);
  backdrop-filter: blur(22px);
}
.metric-card {
  min-height: 126px;
  padding: 15px;
  overflow: hidden;
  position: relative;
  color: var(--text);
  text-decoration: none;
  display: block;
}
.metric-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top right, rgba(9,105,218,.08), transparent 36%);
  pointer-events: none;
}
.metric-card:hover, .metric-card:focus-visible {
  border-color: rgba(102,166,255,.48);
  background: #f6f8fa;
  text-decoration: none;
  transform: translateY(-1px);
}
.metric-card:focus-visible {
  outline: 2px solid rgba(102, 166, 255, .72);
  outline-offset: 2px;
}
.metric-label { color: var(--muted); font-size: 12px; font-weight: 650; }
.metric-value { margin-top: 10px; font-size: 28px; font-weight: 760; line-height: 1; }
.metric-trend { margin-top: 12px; color: var(--muted); font-size: 12px; }
.metric-trend.up { color: #b9f7cc; }
.metric-trend.down { color: #ffb4bd; }
.layout-two {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 344px;
  gap: 18px;
  align-items: start;
}
.content-grid, .right-rail, .stack {
  display: grid;
  gap: 18px;
}
.overview-stack {
  display: grid;
  gap: 18px;
}
.overview-flow .flow-scroll {
  overflow: hidden;
}
.overview-lower {
  display: grid;
  gap: 18px;
}
.overview-side {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}
.activity-panel {
  padding: 16px 16px 14px;
  background: var(--token-panel-bg);
  border-color: var(--token-panel-border);
  color: var(--token-text);
}
.activity-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.activity-title strong {
  display: block;
  font-size: 16px;
}
.activity-title span {
  display: block;
  margin-top: 3px;
  color: var(--token-muted);
  font-size: 12px;
}
.activity-tabs {
  display: inline-flex;
  gap: 4px;
}
.activity-tabs button {
  border: 0;
  border-radius: 4px;
  padding: 4px 8px;
  background: var(--token-control-bg);
  color: var(--token-muted);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.activity-tabs button.active {
  background: var(--token-control-active);
  color: var(--token-control-active-text);
}
.activity-board {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr);
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 2px;
}
.activity-months {
  grid-column: 2;
  display: grid;
  grid-template-columns: repeat(14, 18px);
  gap: 3px;
  color: var(--token-muted);
  font-size: 12px;
}
.activity-month {
  width: 18px;
  text-align: center;
  white-space: nowrap;
  font-size: 11px;
}
.activity-weekdays {
  display: grid;
  grid-template-rows: repeat(7, 14px);
  gap: 3px;
  padding-top: 20px;
  color: var(--token-muted);
  font-size: 12px;
  text-align: right;
}
.activity-grid {
  display: grid;
  grid-template-columns: repeat(14, 18px);
  grid-template-rows: repeat(7, 14px);
  grid-auto-flow: column;
  gap: 3px;
  padding-top: 20px;
}
.activity-panel[data-activity-mode="weekly"] .activity-weekdays,
.activity-panel[data-activity-mode="cumulative"] .activity-weekdays {
  display: none;
}
.activity-panel[data-activity-mode="weekly"] .activity-board,
.activity-panel[data-activity-mode="cumulative"] .activity-board {
  grid-template-columns: minmax(0, 1fr);
}
.activity-panel[data-activity-mode="weekly"] .activity-months,
.activity-panel[data-activity-mode="cumulative"] .activity-months {
  grid-column: 1;
}
.activity-panel[data-activity-mode="weekly"] .activity-grid,
.activity-panel[data-activity-mode="cumulative"] .activity-grid {
  grid-column: 1;
  grid-template-columns: repeat(14, 18px);
  grid-template-rows: 32px;
  grid-auto-flow: column;
}
.activity-panel[data-activity-mode="weekly"] .activity-day,
.activity-panel[data-activity-mode="cumulative"] .activity-day {
  height: 32px;
}
.activity-day {
  width: 14px;
  height: 14px;
  border: 1px solid var(--token-border);
  border-radius: 3px;
  background: var(--token-empty);
  cursor: pointer;
}
.activity-day:hover,
.activity-day:focus-visible,
.activity-day.active {
  outline: 2px solid #0969da;
  outline-offset: 1px;
}
.activity-day[data-level="1"] { background: var(--token-1); border-color: var(--token-1); }
.activity-day[data-level="2"] { background: var(--token-2); border-color: var(--token-2); }
.activity-day[data-level="3"] { background: var(--token-3); border-color: var(--token-3); }
.activity-day[data-level="4"] { background: var(--token-4); border-color: var(--token-4); }
.activity-day:disabled {
  opacity: .45;
  cursor: default;
}
.activity-legend {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  margin-top: 10px;
  color: var(--token-muted);
  font-size: 12px;
}
.legend-box {
  width: 12px;
  height: 12px;
  border: 1px solid var(--token-border);
  border-radius: 3px;
  background: var(--token-empty);
}
.legend-box.level-1 { background: var(--token-1); border-color: var(--token-1); }
.legend-box.level-2 { background: var(--token-2); border-color: var(--token-2); }
.legend-box.level-3 { background: var(--token-3); border-color: var(--token-3); }
.legend-box.level-4 { background: var(--token-4); border-color: var(--token-4); }
.activity-detail {
  margin-top: 14px;
  padding: 12px;
  border: 1px solid var(--token-panel-border);
  border-radius: 8px;
  background: var(--token-control-bg);
}
.activity-detail strong {
  display: block;
  font-size: 14px;
}
.activity-detail ul {
  margin: 8px 0 0;
  padding-left: 18px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
}
.activity-detail li {
  margin: 4px 0;
}
.activity-token {
  color: #1f883d;
  font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  white-space: nowrap;
}
.panel { padding: 16px; }
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.panel-head h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 740;
}
.panel-head span, .subtle {
  color: var(--muted);
  font-size: 12px;
}
.tag {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 4px 8px;
  border-radius: 999px;
  color: var(--muted);
  background: #ffffff;
  font-size: 12px;
  font-weight: 650;
}
.tag.ok { color: #1a7f37; background: #dafbe1; }
.tag.warn { color: #9a6700; background: #fff8c5; }
.tag.danger { color: #cf222e; background: #ffebe9; }
.table-scroll { overflow-x: auto; }
.flow-scroll { overflow: hidden; }
.workflow-table {
  width: 100%;
  min-width: 760px;
  border-collapse: collapse;
}
.workflow-table th {
  height: 34px;
  color: var(--faint);
  font-size: 11px;
  font-weight: 700;
  text-align: left;
  text-transform: uppercase;
  letter-spacing: .06em;
  border-bottom: 1px solid var(--line);
}
.workflow-table td {
  height: 58px;
  border-bottom: 1px solid rgba(168,184,216,.10);
  color: var(--muted);
}
.workflow-table tr[hidden], .searchable[hidden] { display: none; }
.workflow-name { color: var(--text); font-weight: 680; }
.workflow-sub { margin-top: 3px; color: var(--faint); font-size: 12px; }
.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 26px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid currentColor;
  background: #ffffff;
  white-space: nowrap;
}
.status::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.status.running { color: var(--cyan); }
.status.success { color: var(--green); }
.status.failed { color: var(--red); }
.status.pending { color: var(--muted); }
.status.warning { color: var(--amber); }
.progress-track {
  width: min(160px, 100%);
  height: 7px;
  overflow: hidden;
  border-radius: 999px;
  background: #eaeef2;
}
.progress-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--blue), var(--cyan));
}
.flow-board {
  min-width: 960px;
  min-height: 300px;
  position: relative;
  padding: 18px 8px 8px;
}
.flow-node {
  position: absolute;
  width: 154px;
  min-height: 78px;
  padding: 12px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: #ffffff;
  box-shadow: 0 14px 26px rgba(0,0,0,.22);
}
.flow-node.current {
  border-color: rgba(71,215,255,.72);
  box-shadow: 0 0 0 1px rgba(71,215,255,.12), 0 0 34px rgba(71,215,255,.16);
}
.flow-node.failed { border-color: rgba(255,101,122,.72); }
.flow-node small {
  color: var(--faint);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.flow-node strong {
  display: block;
  margin-top: 6px;
  font-size: 13px;
}
.flow-node span {
  display: block;
  margin-top: 6px;
  color: var(--muted);
  font-size: 12px;
}
.flow-line {
  position: absolute;
  height: 2px;
  background: linear-gradient(90deg, rgba(102,166,255,.18), rgba(71,215,255,.72), rgba(102,166,255,.18));
  transform-origin: left center;
}
.flow-line.active::after {
  content: "";
  position: absolute;
  inset: -1px auto -1px 0;
  width: 44px;
  background: linear-gradient(90deg, transparent, #fff, transparent);
  animation: flow 2.4s linear infinite;
  opacity: .62;
}
.subagent-board {
  min-width: 900px;
  display: grid;
  grid-template-columns: repeat(4, minmax(190px, 1fr));
  gap: 12px;
}
.role-column {
  min-height: 310px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #f6f8fa;
}
.role-column h4 {
  margin: 0 0 4px;
  font-size: 14px;
}
.role-column p {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 12px;
}
.task-chip {
  display: block;
  margin-top: 8px;
  padding: 9px;
  border: 1px solid rgba(168,184,216,.14);
  border-radius: 8px;
  background: rgba(15, 23, 42, .7);
}
.task-chip strong { display: block; font-size: 13px; }
.task-chip span { display: block; margin-top: 3px; color: var(--faint); font-size: 12px; }
.queue-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.data-card {
  padding: 14px;
  min-height: 138px;
}
.data-card h4 {
  margin: 0;
  font-size: 14px;
}
.data-card p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}
.data-card footer {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.alert-list, .log-list, .history-list {
  display: grid;
  gap: 10px;
}
.alert, .log, .history-item {
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #f6f8fa;
}
.alert { border-color: rgba(246,189,82,.28); }
.alert.danger { border-color: rgba(255,101,122,.30); }
.alert strong, .log strong, .history-item strong {
  display: block;
  font-size: 13px;
}
.alert p, .log p, .history-item p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.sparkline {
  width: 100%;
  height: 74px;
  margin-top: 8px;
}
.empty-state {
  display: none;
  margin-top: 16px;
  padding: 14px;
  border: 1px dashed var(--line-strong);
  border-radius: 8px;
  color: var(--muted);
  background: rgba(255,255,255,.025);
  font-size: 13px;
}
.empty-state.visible { display: block; }
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.35); opacity: .65; }
}
@keyframes flow {
  from { transform: translateX(-44px); }
  to { transform: translateX(440px); }
}
@media (max-width: 1180px) {
  .layout-two,
  .overview-side { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .queue-grid { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar {
    position: static;
    height: auto;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .nav-section {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
  }
  .nav-label { grid-column: 1 / -1; }
  .topbar, .page-title {
    align-items: stretch;
    flex-direction: column;
  }
  .search { min-width: 0; }
  .metrics { grid-template-columns: 1fr; }
  .main { padding: 16px; }
}

  --grid-line-b: rgba(27,31,36,.035);
  --sidebar-bg: rgba(255, 255, 255, 0.84);
  --control-bg: #ffffff;
  --control-hover: #f6f8fa;
  --panel-bg: #ffffff;
  --soft-bg: #f6f8fa;
  --chip-bg: #f6f8fa;
  --chip-text: #24292f;
  --chip-muted: #57606a;
  --brand-gradient: linear-gradient(145deg, #0969da, #2da44e);
  --brand-shadow: 0 10px 30px rgba(9,105,218,.16);
  --heat-empty: #ebedf0;
  --heat-1: #dafbe1;
  --heat-2: #aceebb;
  --heat-3: #2da44e;
  --heat-4: #1f6f3d;
  --heat-border: #d0d7de;
  --token-panel-bg: rgba(255, 255, 255, 0.86);

  --token-text: #24292f;
  --token-muted: #57606a;
  --token-control-bg: #f6f8fa;
  --token-control-active: #eaf6ef;
  --token-control-active-text: #1f883d;
  --token-empty: #edf2f7;
  --token-1: #dff7e8;
  --token-2: #9be7b3;
  --token-3: #46b86f;
  --token-4: #1f883d;
  --token-border: #d8e2dc;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1117;
  --bg-2: #161b22;
  --panel: #161b22;
  --panel-strong: #21262d;
  --line: #30363d;
  --line-strong: #484f58;
  --text: #e6edf3;
  --muted: #8b949e;
  --faint: #6e7681;
  --blue: #58a6ff;
  --cyan: #56d364;
  --green: #3fb950;
  --amber: #d29922;
  --red: #f85149;
  --violet: #b39adc;
  --blue-soft: #1b2733;
  --green-soft: #1b2b25;
  --cyan-soft: #192b2d;
  --amber-soft: #30291c;
  --violet-soft: #282333;

    radial-gradient(circle at 18% 0%, rgba(88, 166, 255, 0.12), transparent 34%),
    radial-gradient(circle at 80% 8%, rgba(63, 185, 80, 0.10), transparent 28%),
    linear-gradient(135deg, #0d1117, #111820 62%, #0d1117);
  --grid-line-a: rgba(240,246,252,.035);
  --grid-line-b: rgba(240,246,252,.035);
  --sidebar-bg: rgba(13, 17, 23, 0.86);
  --control-bg: #161b22;
  --control-hover: #21262d;
  --panel-bg: #161b22;
  --soft-bg: #0d1117;
  --chip-bg: #21262d;
  --chip-text: #e6edf3;
  --chip-muted: #8b949e;

  --brand-shadow: 0 10px 30px rgba(88,166,255,.14);
  --heat-empty: #21262d;
  --heat-1: #0e4429;
  --heat-2: #006d32;
  --heat-3: #26a641;
  --heat-4: #39d353;
  --heat-border: #30363d;
  --token-panel-bg: #252733;
  --token-panel-border: #303342;
  --token-text: #f3f4f7;
  --token-muted: #a7abb8;
  --token-control-bg: rgba(255,255,255,.04);
  --token-control-active: rgba(255,255,255,.08);
  --token-control-active-text: #ffffff;
  --token-empty: #303342;
  --token-1: #0e4429;
  --token-2: #006d32;
  --token-3: #26a641;
  --token-4: #39d353;
  --token-border: rgba(255,255,255,.04);
}

body {
  background: var(--page-background);
}

body::before {
  background-image:
    linear-gradient(var(--grid-line-a) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line-b) 1px, transparent 1px);
}

code {
  border-color: var(--line);
  color: var(--blue);
  background: var(--soft-bg);
}

.sidebar {
  background: var(--sidebar-bg);
}

.brand-mark {
  background: var(--brand-gradient);
  box-shadow: var(--brand-shadow);
}

.nav-item:hover,
.nav-item.active,
.nav-item:focus-visible,
.metric-card:hover,
.metric-card:focus-visible {
  background: var(--control-hover);
}

.search,
.top-action,
.tag,
.status,
.task-chip,
.alert,
.log,
.history-item,
.activity-detail {
  background: var(--control-bg);
}

.metric-card,
.panel,
.data-card {
  background: var(--panel-bg);
}

.role-column,
.data-card p,
.alert p,
.log p,
.history-item p,
.activity-detail ul {
  color: var(--muted);
}

.role-column,
.alert,
.log,
.history-item {
  background: var(--soft-bg);
}

.task-chip {
  border-color: var(--line);
  background: var(--chip-bg);
}

.task-chip strong {
  color: var(--chip-text);
}

.task-chip span {
  color: var(--chip-muted);
}

.flow-node {
  background: var(--panel-bg);
}

.activity-day,
.legend-box {
  border-color: var(--heat-border);
  background: var(--heat-empty);
}

.activity-day[data-level="1"],
.legend-box.level-1 { background: var(--heat-1); }
.activity-day[data-level="2"],
.legend-box.level-2 { background: var(--heat-2); }
.activity-day[data-level="3"],
.legend-box.level-3 { background: var(--heat-3); }
.activity-day[data-level="4"],
.legend-box.level-4 { background: var(--heat-4); }

.activity-panel .activity-day,
.activity-panel .legend-box {
  border-color: var(--token-border);
  background: var(--token-empty);
}

.panel.activity-panel {
  background: var(--token-panel-bg);
  border-color: var(--token-panel-border);
  color: var(--token-text);
}

.panel.activity-panel .activity-detail {
  background: var(--token-control-bg);
  border-color: var(--token-panel-border);
}

.activity-panel .activity-day[data-level="1"],
.activity-panel .legend-box.level-1 { background: var(--token-1); }
.activity-panel .activity-day[data-level="2"],
.activity-panel .legend-box.level-2 { background: var(--token-2); }
.activity-panel .activity-day[data-level="3"],
.activity-panel .legend-box.level-3 { background: var(--token-3); }
.activity-panel .activity-day[data-level="4"],
.activity-panel .legend-box.level-4 { background: var(--token-4); }

.theme-toggle {
  width: 42px;
  min-width: 42px;
  padding: 0;
  font-size: 18px;
  line-height: 1;
}

.sidebar {
  overflow-y: auto;
  overscroll-behavior: contain;
}
.page-header {
  position: sticky;
  top: 0;
  z-index: 20;
  margin: -18px -22px 18px;
  padding: 18px 22px 1px;
  border-bottom: 1px solid var(--line);
  background: var(--page-background, var(--panel-bg));
  box-shadow: 0 8px 20px rgba(31, 35, 40, .06);
  backdrop-filter: blur(22px);
}
.page-header .topbar { margin-bottom: 6px; }
.page-header .page-title { margin-bottom: 14px; }
@media (max-width: 860px) {
  .page-header {
    position: static;
    margin: -16px -16px 16px;
    padding: 16px 16px 1px;
  }
}
